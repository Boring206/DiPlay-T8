name: 車機回報 / Head unit report
description: 你的車機能不能用、卡在哪裡。Whether it works on your head unit, and where it stops.
title: '[車機 / Head unit] '
body:
  - type: markdown
    attributes:
      value: |
        請在停車時測試。這裡是公開的：貼上報告前請先看過一遍，不要貼密碼。
        Test while parked. Reports here are public: read a report through before pasting it, and never post passwords.
  - type: input
    id: version
    attributes:
      label: DiPlay T8 版本 / version
      description: 首頁左下角，或報告的第一行。Shown at the bottom left of the home page and on the report's first line.
      placeholder: 0.2.12-t8.7
    validations: {required: true}
  - type: input
    id: unit
    attributes:
      label: 車機 / Head unit
      description: |
        照抄首頁「車機相容性檢查」卡片上、結論下面那一行小字（t8.7 起），再加上品牌或賣場名稱。設定頁顯示的 Android 版本常常不是真的，以那一行的 API 數字為準。
        Copy the small line under the verdict on the home page's "Head unit check" card (t8.7 and later) and add the brand or shop name. The Android version on a unit's settings page is often not the real one; go by the API number on that line.
      placeholder: 'Allwinner T8 · Android 8.1.0 (API 27) · sun8iw6p1'
    validations: {required: true}
  - type: input
    id: firmware
    attributes:
      label: 車機「關於」頁的系統版本與 MCU 版本 / System and MCU version from the unit's About page
      description: 同一個品牌會賣好幾種主機板，這兩行才分得出是哪一種。One brand sells several boards; these two lines tell them apart.
      placeholder: 'V9.3.1_20190906.113920_TW2-FD-AHD / T8.3.19-231-14-A4C101-190802'
    validations: {required: false}
  - type: dropdown
    id: result
    attributes:
      label: 結果 / Result
      options:
        - 成功進入 CarPlay / CarPlay started
        - 連不上 / Could not connect
        - 連上後有問題（畫面、聲音、斷線）/ Connected, with picture, sound or dropout problems
        - 其他 / Other
    validations: {required: true}
  - type: dropdown
    id: vendor-bluetooth
    attributes:
      label: 車機打電話、聽音樂是不是用廠商另一個「藍牙」App 配對？ / Are calls and music paired in a separate "Bluetooth" app from the maker?
      options: ['是 / Yes', '不是，用系統藍牙設定 / No, in the system Bluetooth settings', '不確定 / Not sure']
    validations: {required: true}
  - type: textarea
    id: message
    attributes:
      label: 畫面停在哪句話 / What the screen said
      description: |
        首頁檢查卡片的結論，或連線畫面上方的訊息和下方「排查用的詳細資訊」那幾行。拍照貼上來也可以。
        The verdict on the home page's check card, or the message on the connecting screen with the detail lines under it. A photo is fine.
    validations: {required: true}
  - type: input
    id: other-builds
    attributes:
      label: 其他版本試過嗎？/ Other builds tried?
      description: 原版 DiPlay 或 DiPlay-Legacy 的版本與結果。Version and result of upstream DiPlay or DiPlay-Legacy on the same unit.
      placeholder: '原版 0.2.15：一直停在「正在連線」 / upstream 0.2.15: stuck on "Connecting"'
    validations: {required: false}
  - type: input
    id: phone
    attributes:
      label: iPhone 型號與 iOS 版本 / iPhone model and iOS version
    validations: {required: false}
  - type: textarea
    id: report
    attributes:
      label: 診斷報告 / Diagnostic report
      description: |
        設定 → 診斷 → 檢視報告。至少貼上開頭到「Installed apps」為止的部分；位址已自動遮蔽。
        Settings → Diagnostics → View report. Paste at least the part from the top down to "Installed apps"; addresses are redacted automatically.
        車機和電腦在同一個 Wi-Fi 時，可以用瀏覽器開 http://<車機 IP>:8765/ 複製。With the head unit and a computer on the same Wi-Fi, http://<head unit IP>:8765/ serves it.
      render: text
    validations: {required: false}
